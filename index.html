<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maitenliga 2026</title>
<style>
:root{--bg:#071018;--card:#101b24;--line:#26343e;--y:#ffd21f;--muted:#9eabb5;--w:#f7f7f4}
*{box-sizing:border-box} body{margin:0;background:#071018;color:var(--w);font-family:Arial,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
header{position:sticky;top:0;background:#071018f5;z-index:5;border-bottom:1px solid var(--line);padding:16px}
.brand{font-size:25px;font-weight:900;font-style:italic}.brand span,.yellow{color:var(--y)}
.sync{font-size:11px;color:var(--muted);margin-top:5px}
nav{display:flex;justify-content:space-between;margin-top:12px}
nav button{background:none;border:0;color:#aeb7be;font-weight:800;font-size:11px;padding:12px 4px;cursor:pointer}
nav button.active{color:var(--y);border-bottom:2px solid var(--y)}
main{padding:16px}.card{background:linear-gradient(145deg,#101c25,#0b141c);border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0}
.hero{text-align:center;padding:22px 5px}.hero h1{margin:5px;font-size:28px}.tag{color:var(--muted);font-size:11px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.award b{display:block;margin-top:7px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}.stats b{font-size:21px;display:block}.stats small{font-size:10px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:9px 3px;border-bottom:1px solid var(--line);text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}
.player{width:100%;color:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pill{border:1px solid var(--line);border-radius:20px;padding:5px 8px;color:var(--muted);font-size:11px}
.fact{padding:11px 0;border-bottom:1px solid var(--line)} footer{text-align:center;color:#65737e;font-size:10px;padding:25px}
.empty{text-align:center;padding:30px 12px}.empty b{display:block;font-size:20px;margin-bottom:8px}
@media(min-width:700px){body{padding:25px}.app{border:1px solid var(--line);border-radius:22px;overflow:hidden}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">⚽ MAITENLIGA <span>2026</span></div>
<div id="sync" class="sync">✓ Fecha 1 · conectando planilla…</div>
<nav>
<button class="active" data-page="inicio">INICIO</button>
<button data-page="ranking">RANKING</button>
<button data-page="jugadores">JUGADORES</button>
<button data-page="historial">HISTORIAL</button>
</nav>
</header>
<main id="view"></main>
<footer>Fútbol, amigos y estadísticas innecesariamente importantes.</footer>
</div>
<script>
(function(){
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRfaC8Z9GDnjyLsdMCw6Lr4bBx5jvgmDHJy-fBNao-HIvDSFPaiFJU4gPDgmo9pfXgYYJmVXJjVP-Gs/pub?gid=1006372394&single=true&output=csv";
const roster=[
["Karim Benzemax","Jugador"],["Lester Mbappé","Jugador"],["Vale Modrić","Jugador"],["Jose Bellingham","Jugador"],
["Luisao Dos Santos","Jugador"],["Chalo Haaland","Jugador"],["Jairen Courtois","Arquero"],["Juanjo Insigne","Jugador"],
["Luxito Dibu","Arquero"],["Ale Neymar","Jugador"],["Walala Osorio","Defensa"],["Rafael Raphinha","Jugador"]];
let rows=[];
let stats=roster.map(x=>({name:x[0],pos:x[1],pj:0,g:0,a:0,w:0,mvp:0,y:0,r:0,gc:0,cs:0,pts:0}));
let current="inicio";
const view=document.getElementById("view"), sync=document.getElementById("sync");
const nav=[...document.querySelectorAll("[data-page]")];
const yes=v=>["si","sí","yes","1","true","x"].includes(String(v||"").trim().toLowerCase());
const n=v=>{const x=Number(String(v||"0").replace(",","."));return Number.isFinite(x)?x:0};
function empty(){return '<div class="card empty"><b>⚽ Temporada lista para comenzar</b><span class="tag">Los 12 jugadores están cargados en cero.</span><p>Cuando ingreses la primera fecha en Google Sheets, aparecerán las estadísticas.</p></div>'}
function played(){return rows.filter(r=>yes(r.jugo))}
function calc(){
 stats=roster.map(([name,pos])=>{
  const rr=rows.filter(r=>r.jugador===name && yes(r.jugo));
  let s={name,pos,pj:rr.length,g:0,a:0,w:0,mvp:0,y:0,r:0,gc:0,cs:0,pts:0};
  rr.forEach(x=>{s.g+=n(x.goles);s.a+=n(x.asist);s.w+=yes(x.victoria)?1:0;s.mvp+=yes(x.mvp)?1:0;s.y+=n(x.amarillas);s.r+=n(x.rojas);s.gc+=n(x.gc);s.cs+=yes(x.cs)?1:0});
  s.pts=s.g*3+s.a*2+s.w*2+s.mvp*3;return s
 }).sort((a,b)=>b.pts-a.pts||(b.g+b.a)-(a.g+a.a)||a.name.localeCompare(b.name))
}
function top(k){return [...stats].sort((a,b)=>b[k]-a[k]||a.name.localeCompare(b.name))[0]}
function inicio(){
 if(!played().length)return '<div class="hero"><h1>♛ MAITENLIGA 2026</h1><div class="tag">La liga de los amigos</div></div>'+empty();
 const dates=[...new Set(played().map(x=>x.fecha))], last=dates[dates.length-1], lr=played().filter(x=>x.fecha===last), m=lr.find(x=>yes(x.mvp));
 return `<div class="hero"><h1>♛ MAITENLIGA 2026</h1><div class="tag">La liga de los amigos</div></div><h2>ÚLTIMA FECHA</h2><div class="card"><div class="tag">Fecha ${last}</div><h2>${lr.length} jugadores participaron</h2></div>${m?`<div class="card"><div class="yellow">⭐ MVP DE LA FECHA</div><h2>${m.jugador}</h2><div class="stats"><div><b>${n(m.goles)}</b><small>Goles</small></div><div><b>${n(m.asist)}</b><small>Asist.</small></div><div><b>⭐</b><small>MVP</small></div><div><b>${yes(m.victoria)?"🏆":"—"}</b><small>Victoria</small></div><div><b>${n(m.amarillas)}</b><small>🟨</small></div></div></div>`:""}<h2>PREMIOS DE LA FECHA</h2><div class="grid"><div class="card award">⭐ MVP<b>Walala Osorio</b></div><div class="card award">💪 Pulmón<b>Chalo Haaland</b></div><div class="card award">🪓 Leñador<b>Karim Benzemax</b></div><div class="card award">🪵 Tronco<b>Lester Mbappé</b></div><div class="card award">🧤 Atajada<b>Jairen Courtois</b></div></div>`
}
function ranking(){
 const tr=stats.map((p,i)=>`<tr><td>${["🥇","🥈","🥉"][i]||i+1}</td><td>${p.name}</td><td>${p.pj}</td><td>${p.g}</td><td>${p.a}</td><td>${p.mvp}</td><td><b>${p.pts}</b></td></tr>`).join("");
 return `<h2>🏆 RANKING</h2><div class="card"><table><tr><th>#</th><th>Jugador</th><th>PJ</th><th>G</th><th>A</th><th>MVP</th><th>PTS</th></tr>${tr}</table></div>${played().length?`<h2>LÍDERES</h2><div class="grid"><div class="card award">⚽ Goleador<b>${top("g").name}</b><span class="yellow">${top("g").g} goles</span></div><div class="card award">🎯 Asistidor<b>${top("a").name}</b><span class="yellow">${top("a").a} asist.</span></div><div class="card award">⭐ Más MVP<b>${top("mvp").name}</b><span class="yellow">${top("mvp").mvp} MVP</span></div><div class="card award">🟨 Tarjetas<b>${top("y").name}</b><span class="yellow">${top("y").y} amarillas</span></div></div>`:""}`
}
function jugadores(){return `<h2>👥 JUGADORES</h2>${stats.map(p=>`<button class="card player" data-player="${p.name}"><span><b>${p.name}</b><span class="tag" style="display:block">${p.pos}</span></span><span class="pill">${p.pts} pts ›</span></button>`).join("")}`}
function historial(){return played().length?`<h2>📊 DATOS QUE NADIE PIDIÓ</h2><div class="card"><div class="fact">🔥 <b>${top("g").name}</b> lidera los goles con ${top("g").g}.</div><div class="fact">🎯 <b>${top("a").name}</b> lidera las asistencias con ${top("a").a}.</div><div class="fact">🏆 <b>${top("w").name}</b> suma ${top("w").w} victorias.</div><div class="fact">🪓 <b>${top("y").name}</b> lidera las amarillas con ${top("y").y}.</div></div>`:'<h2>📊 HISTORIAL</h2>'+empty()}
function profile(name){
 const p=stats.find(x=>x.name===name);
 view.innerHTML=`<button id="back" style="background:none;border:0;color:var(--y);font-weight:bold;cursor:pointer">← Jugadores</button><div class="card"><h1>${p.name}</h1><div class="tag">${p.pos}</div></div><div class="card"><div class="stats"><div><b>${p.pj}</b><small>PJ</small></div><div><b>${p.g}</b><small>Goles</small></div><div><b>${p.a}</b><small>Asist.</small></div><div><b>${p.mvp}</b><small>MVP</small></div><div><b>${p.pts}</b><small>Pts</small></div></div>${p.pos==="Arquero"?`<hr style="border-color:var(--line)"><div class="stats"><div><b>${p.gc}</b><small>Recibidos</small></div><div><b>${p.cs}</b><small>Vallas inv.</small></div></div>`:""}</div>`;
 document.getElementById("back").onclick=()=>go("jugadores")
}
function bind(){view.querySelectorAll("[data-player]").forEach(b=>b.onclick=()=>profile(b.dataset.player))}
function go(p){current=p;nav.forEach(b=>b.classList.toggle("active",b.dataset.page===p));view.innerHTML=({inicio,ranking,jugadores,historial}[p]||inicio)();bind()}
nav.forEach(b=>b.onclick=()=>go(b.dataset.page));
go("inicio");

function parseCSV(text){
 let a=[],r=[],v="",q=false;
 for(let i=0;i<text.length;i++){let c=text[i],nx=text[i+1];if(c=='"'&&q&&nx=='"'){v+='"';i++}else if(c=='"')q=!q;else if(c==","&&!q){r.push(v);v=""}else if((c=="\n"||c=="\r")&&!q){if(c=="\r"&&nx=="\n")i++;r.push(v);if(r.some(x=>x.trim()))a.push(r);r=[];v=""}else v+=c}
 r.push(v);if(r.some(x=>x.trim()))a.push(r);return a
}
function key(s){return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
async function load(){
 const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),8000);
 try{
  const res=await fetch(CSV_URL+"&t="+Date.now(),{cache:"no-store",signal:ctl.signal}); if(!res.ok)throw Error(res.status);
  const table=parseCSV(await res.text()); const hi=table.findIndex(r=>r.some(c=>key(c)==="fecha")); if(hi<0)throw Error("encabezados");
  const h=table[hi].map(key);
  rows=table.slice(hi+1).filter(r=>r.some(x=>x.trim())).map(r=>{
   const o={};h.forEach((k,i)=>o[k]=r[i]||"");
   return {fecha:o.fecha||"",jugador:o.jugador||"",jugo:o.jugo||"",goles:o.goles||"",asist:o.asistencias||o["asist."]||"",victoria:o.victoria||o.gano||"",mvp:o.mvp||"",amarillas:o.amarillas||o["🟨"]||"",rojas:o.rojas||o["🟥"]||"",gc:o["goles recibidos"]||"",cs:o["valla invicta"]||""}
  });
  calc();sync.textContent="● Google Sheets conectado";go(current)
 }catch(e){sync.textContent="⚠ Planilla no disponible · web funcionando";console.error(e)}
 finally{clearTimeout(timer)}
}
load();
})();
</script>
</body></html>
